<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mystery Logo Reveal — Designathon</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #080b12;
    --surface: #0e1420;
    --card-back: #111827;
    --card-border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #ff3cac;
    --gold: #ffd700;
    --text: #e8edf5;
    --muted: #4a5568;
    --glow: 0 0 30px rgba(0,212,255,0.25);
    --flip-duration: 0.7s;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
    pointer-events: none;
  }

  /* Ambient blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .blob1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; animation: drift1 18s ease-in-out infinite; }
  .blob2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -80px; animation: drift2 22s ease-in-out infinite; }
  .blob3 { width: 300px; height: 300px; background: var(--gold); top: 40%; left: 50%; transform: translate(-50%,-50%); animation: drift3 14s ease-in-out infinite; }

  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,60px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-50px,-40px)} }
  @keyframes drift3 { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.3)} }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 48px 20px 28px;
  }

  .event-label {
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.85;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1.05;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 80%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* Stats bar */
  .stats-bar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 14px 20px;
    margin: 0 auto 32px;
    max-width: 480px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 40px;
    backdrop-filter: blur(10px);
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-number {
    font-family: 'Syne', sans-serif;
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    transition: color 0.4s;
  }

  .stat-number.zero { color: var(--accent2); }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .stat-divider {
    width: 1px;
    height: 36px;
    background: var(--card-border);
  }

  /* Grid */
  .grid-wrap {
    position: relative;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  /* Card */
  .card-scene {
    perspective: 900px;
    aspect-ratio: 3/4;
    cursor: pointer;
  }

  .card-scene.revealed { cursor: default; }

  .card-scene.revealed .card-inner { transform: rotateY(180deg); }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform var(--flip-duration) cubic-bezier(0.4,0,0.2,1);
    border-radius: 16px;
  }

  .card-scene:not(.revealed):hover .card-inner {
    transform: rotateY(12deg) translateY(-6px);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* Back face */
  .card-back-face {
    background: var(--card-back);
    border: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s;
  }

  .card-scene:not(.revealed):hover .card-back-face {
    box-shadow: 0 16px 48px rgba(0,0,0,0.6), var(--glow);
    border-color: rgba(0,212,255,0.3);
  }

  .back-pattern {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,212,255,0.04) 8px, rgba(0,212,255,0.04) 9px),
      repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(0,212,255,0.04) 8px, rgba(0,212,255,0.04) 9px);
  }

  .back-icon {
    position: relative;
    z-index: 1;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(255,60,172,0.1));
    border: 1px solid rgba(0,212,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    animation: pulse-icon 3s ease-in-out infinite;
  }

  @keyframes pulse-icon {
    0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.2); }
    50% { box-shadow: 0 0 0 10px rgba(0,212,255,0); }
  }

  .back-text {
    position: relative;
    z-index: 1;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-number {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 10px;
    color: rgba(255,255,255,0.15);
    z-index: 1;
  }

  /* Front face */
  .card-front-face {
    background: linear-gradient(155deg, #111827 0%, #0d1521 100%);
    border: 1px solid rgba(0,212,255,0.25);
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), var(--glow);
  }

  .logo-ring {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-ring img {
    width: 64px;
    height: 64px;
    object-fit: contain;
  }

  .brand-name {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    text-align: center;
    letter-spacing: 0.04em;
  }

  .brand-tag {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.8;
  }

  /* Shimmer on reveal */
  .card-front-face::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: none;
  }

  .card-scene.revealed .card-front-face::before {
    animation: shimmer 2s ease 0.3s forwards;
  }

  @keyframes shimmer {
    to { transform: translateX(200%); }
  }

  /* Reset Button */
  .footer-bar {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    padding: 0 20px 60px;
  }

  .reset-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 36px;
    background: transparent;
    border: 1px solid var(--card-border);
    border-radius: 40px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }

  .reset-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    box-shadow: 0 0 24px rgba(255,60,172,0.15);
  }

  .reset-btn svg { transition: transform 0.4s; }
  .reset-btn:hover svg { transform: rotate(180deg); }

  /* Confetti canvas */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
  }

  /* Win overlay */
  .win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(8,11,18,0.85);
    backdrop-filter: blur(12px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    text-align: center;
    padding: 40px;
  }

  .win-overlay.show { display: flex; }

  .win-emoji { font-size: 64px; animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-16px)} }

  .win-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem,5vw,3.5rem);
    font-weight: 800;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .win-sub { font-size: 13px; color: var(--muted); letter-spacing: 0.15em; }

  .win-close {
    margin-top: 10px;
    padding: 12px 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 40px;
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.3s, transform 0.2s;
  }
  .win-close:hover { opacity: 0.85; transform: scale(1.04); }

  /* Responsive */
  @media (max-width: 600px) {
    .grid-wrap { grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 14px 48px; }
    .stats-bar { gap: 18px; }
  }
  @media (max-width: 400px) {
    .grid-wrap { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<canvas id="confetti-canvas"></canvas>

<header>
  <div class="event-label">✦ Designathon 2026 ✦</div>
  <h1>Mystery Logo<br/>Reveal</h1>
  <p class="subtitle">Flip a card to reveal the brand</p>
</header>

<div class="stats-bar">
  <div class="stat">
    <span class="stat-number" id="stat-remaining">25</span>
    <span class="stat-label">Remaining</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <span class="stat-number" id="stat-revealed">0</span>
    <span class="stat-label">Revealed</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <span class="stat-number" id="stat-total">25</span>
    <span class="stat-label">Total</span>
  </div>
</div>

<div class="grid-wrap" id="card-grid"></div>

<div class="footer-bar">
  <button class="reset-btn" id="reset-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
    Reset Deck
  </button>
</div>

<div class="win-overlay" id="win-overlay">
  <div class="win-emoji">🏆</div>
  <div class="win-title">All Brands Revealed!</div>
  <p class="win-sub">The Designathon mystery is solved.</p>
  <button class="win-close" id="win-close">Reset & Play Again</button>
</div>

<script>
const BRANDS = [
  { name: 'Apple',         domain: 'apple.com',        tag: 'Technology' },
  { name: "McDonald's",    domain: 'mcdonalds.com',    tag: 'Fast Food' },
  { name: 'Starbucks',     domain: 'starbucks.com',    tag: 'Coffee' },
  { name: 'Instagram',     domain: 'instagram.com',    tag: 'Social Media' },
  { name: 'Netflix',       domain: 'netflix.com',      tag: 'Streaming' },
  { name: 'Tesla',         domain: 'tesla.com',        tag: 'EV & Energy' },
  { name: 'Snapchat',      domain: 'snapchat.com',     tag: 'Social Media' },
  { name: 'KFC',           domain: 'kfc.com',          tag: 'Fast Food' },
  { name: 'BMW',           domain: 'bmw.com',          tag: 'Automotive' },
  { name: 'Shell',         domain: 'shell.com',        tag: 'Energy' },
  { name: 'Pepsi',         domain: 'pepsi.com',        tag: 'Beverages' },
  { name: 'Nike',          domain: 'nike.com',         tag: 'Sportswear' },
  { name: 'Google',        domain: 'google.com',       tag: 'Technology' },
  { name: 'Adidas',        domain: 'adidas.com',       tag: 'Sportswear' },
  { name: 'Samsung',       domain: 'samsung.com',      tag: 'Electronics' },
  { name: 'Spotify',       domain: 'spotify.com',      tag: 'Music' },
  { name: 'YouTube',       domain: 'youtube.com',      tag: 'Video' },
  { name: 'NASA',          domain: 'nasa.gov',         tag: 'Space Agency' },
  { name: 'Windows',       domain: 'microsoft.com',    tag: 'Technology' },
  { name: 'Red Bull',      domain: 'redbull.com',      tag: 'Energy Drinks' },
  { name: 'IKEA',          domain: 'ikea.com',         tag: 'Furniture' },
  { name: 'LinkedIn',      domain: 'linkedin.com',     tag: 'Professional' },
  { name: 'Air India',     domain: 'airindia.com',     tag: 'Aviation' },
  { name: 'Nokia',         domain: 'nokia.com',        tag: 'Telecom' },
  { name: 'Sony',          domain: 'sony.com',         tag: 'Electronics' },
];

// ── Audio ───────────────────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playFlipSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
    osc.start(); osc.stop(ctx.currentTime + 0.22);
  } catch(e) {}
}

function playRevealSound() {
  try {
    const ctx = getAudioCtx();
    [0, 0.08, 0.16].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.value = [523, 659, 784][i];
      gain.gain.setValueAtTime(0.12, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.3);
    });
  } catch(e) {}
}

// ── Confetti ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('confetti-canvas');
const ctx2d = canvas.getContext('2d');
let particles = [];
let animFrame;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const COLORS = ['#00d4ff','#ff3cac','#ffd700','#7fff00','#ff6b35','#c77dff','#ffffff'];

function spawnConfetti(x, y) {
  for (let i = 0; i < 80; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 2) * 12,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      size: Math.random() * 8 + 4,
      gravity: 0.45,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 8,
      life: 1,
      decay: Math.random() * 0.012 + 0.008,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
    });
  }
  if (!animFrame) animateConfetti();
}

function animateConfetti() {
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += p.gravity;
    p.rotation += p.rotSpeed;
    p.life -= p.decay;
    ctx2d.save();
    ctx2d.globalAlpha = Math.max(0, p.life);
    ctx2d.translate(p.x, p.y);
    ctx2d.rotate(p.rotation * Math.PI / 180);
    ctx2d.fillStyle = p.color;
    if (p.shape === 'rect') ctx2d.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    else { ctx2d.beginPath(); ctx2d.arc(0,0,p.size/2,0,Math.PI*2); ctx2d.fill(); }
    ctx2d.restore();
  });
  animFrame = particles.length > 0 ? requestAnimationFrame(animateConfetti) : null;
}

// ── State ───────────────────────────────────────────────────────────────────
let revealedCount = 0;
const TOTAL = BRANDS.length;

function updateStats() {
  const remaining = TOTAL - revealedCount;
  document.getElementById('stat-remaining').textContent = remaining;
  document.getElementById('stat-revealed').textContent = revealedCount;
  const remEl = document.getElementById('stat-remaining');
  remEl.classList.toggle('zero', remaining === 0);
}

// ── Build Grid ───────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildGrid() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  revealedCount = 0;
  updateStats();

  const shuffled = shuffle(BRANDS);

  shuffled.forEach((brand, i) => {
    const scene = document.createElement('div');
    scene.className = 'card-scene';
    scene.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back-face">
          <div class="back-pattern"></div>
          <div class="back-icon">🎭</div>
          <div class="back-text">Tap to reveal</div>
          <div class="card-number">#${String(i+1).padStart(2,'0')}</div>
        </div>
        <div class="card-face card-front-face">
          <div class="logo-ring">
            <img
              src="https://logo.clearbit.com/${brand.domain}"
              alt="${brand.name} logo"
              loading="lazy"
              onerror="this.style.display='none';this.parentElement.textContent='${brand.name[0]}'"
            />
          </div>
          <div class="brand-name">${brand.name}</div>
          <div class="brand-tag">${brand.tag}</div>
        </div>
      </div>
    `;

    scene.addEventListener('click', () => {
      if (scene.classList.contains('revealed')) return;
      scene.classList.add('revealed');
      revealedCount++;
      updateStats();

      playFlipSound();
      setTimeout(playRevealSound, 350);

      // confetti from card center
      const rect = scene.getBoundingClientRect();
      spawnConfetti(rect.left + rect.width/2, rect.top + rect.height/2);

      if (revealedCount === TOTAL) {
        setTimeout(() => {
          document.getElementById('win-overlay').classList.add('show');
          spawnConfetti(window.innerWidth/2, window.innerHeight/3);
        }, 900);
      }
    });

    // stagger entrance
    scene.style.opacity = '0';
    scene.style.transform = 'translateY(24px)';
    scene.style.transition = 'opacity 0.45s ease, transform 0.45s ease';
    grid.appendChild(scene);

    setTimeout(() => {
      scene.style.opacity = '1';
      scene.style.transform = 'translateY(0)';
    }, 60 + i * 55);
  });
}

// ── Reset ────────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  document.getElementById('win-overlay').classList.remove('show');
  buildGrid();
});
document.getElementById('win-close').addEventListener('click', () => {
  document.getElementById('win-overlay').classList.remove('show');
  buildGrid();
});

// ── Init ─────────────────────────────────────────────────────────────────────
buildGrid();
</script>
</body>
</html>
