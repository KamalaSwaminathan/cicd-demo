<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem 2.5rem; border-radius: 12px; max-width: 520px; }
    h1 { margin-top: 0; color: #38bdf8; }
    dt { color: #94a3b8; font-size: .85rem; margin-top: .8rem; }
    dd { margin: 0; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="message">Loading…</h1>
    <dl>
      <dt>Build version (git commit)</dt><dd id="version">-</dd>
      <dt>Served by pod</dt><dd id="pod">-</dd>
    </dl>
    <p style="color:#94a3b8;font-size:.8rem">Refresh a few times: the pod name changes because the Service load-balances across replicas.</p>
  </div>
  <script>
    fetch('/api/info').then(r => r.json()).then(d => {
      document.getElementById('message').textContent = d.message;
      document.getElementById('version').textContent = d.version;
      document.getElementById('pod').textContent = d.pod;
    });
  </script>
</body>
</html>
